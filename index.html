<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>UESI Prototype Gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --slate:#465d6d; --gold:#e7b223; --teal:#5dbbb8; --ink:#374151; --soft:#6b7280; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f6f6f6; color: var(--ink); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.card { width: 100%; max-width: 460px; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(20,35,45,.14); padding: 32px 30px 28px; }
.brand { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 22px; }
.brand svg { width: 84px; height: 60px; flex: none; }
.wm { line-height: 1.12; color: var(--slate); font-size: 17px; text-transform: uppercase; }
.wm b { display: block; font-weight: 700; } .wm span { display: block; font-weight: 400; } .wm em { font-style: normal; font-weight: 700; color: var(--gold); letter-spacing: .04em; }
h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; color: var(--slate); text-transform: uppercase; }
p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; }
label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid #cbd3d8; border-radius: 0; background: #fff; color: var(--ink); }
input:focus-visible { outline: 3px solid #0096ff; outline-offset: 1px; }
button { margin-top: 14px; width: 100%; border: 0; padding: 13px 20px; background: var(--slate); color: #fff; font: inherit; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 14px -6px rgba(0,0,0,.3); }
button[disabled] { opacity: .6; cursor: progress; }
.err { min-height: 22px; margin-top: 10px; font-size: 14px; color: #a3401a; font-weight: 600; }
.note { margin: 14px 0 0; font-size: 12.5px; color: var(--soft); }
</style></head><body>
